name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos que necesita deploy-pages para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Si se empujan dos commits seguidos, solo se publica el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # base-href relativo: sirve igual en danielrguezm.github.io/web-portfolio/
      # que en la raiz del dominio si algun dia se cambia.
      - name: Compilar
        run: npm run build -- --base-href ./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio/browser

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4
